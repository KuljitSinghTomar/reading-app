<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wonder Island - Blender Bridge</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#E5E7EB", /* Neutral greyish-white like in reference */
                        "background-canvas": "#f3f4f6",
                        "island-accent": "#4ade80",
                        "island-pink": "#ff8bcb",
                        "island-purple": "#4b2038",
                        "tactile-shadow": "rgba(0,0,0,0.15)"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'tactile': '0 10px 0 rgba(0,0,0,0.1)',
                        'inner-soft': 'inset 0 4px 8px rgba(255,255,255,0.4), inset 0 -4px 8px rgba(0,0,0,0.1)',
                        'block-squish': 'inset 0 -12px 0 rgba(0,0,0,0.15), 0 20px 30px rgba(0,0,0,0.1)'
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .tactile-block {
            box-shadow: 0 12px 0 #d1d5db, 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }
        .tactile-block:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #d1d5db, 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .slider-track-inner {
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.15);
        }
        .letter-inner {
            box-shadow: inset 0 6px 0 rgba(255,255,255,0.3), inset 0 -6px 0 rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-[#dcdde1] font-display text-island-purple overflow-hidden select-none">
<!-- Main Container for iPad Landscape -->
<div class="relative h-screen w-full flex flex-col bg-gradient-to-b from-[#e5e7eb] to-[#d1d5db]">
<!-- Header -->
<header class="flex items-center justify-between px-10 py-6 w-full z-10">
<button class="flex items-center gap-2 px-5 py-3 rounded-2xl bg-white/80 border-b-4 border-slate-300 hover:bg-white active:translate-y-1 active:border-b-0 transition-all">
<span class="material-symbols-outlined font-bold text-island-purple">arrow_back</span>
<span class="font-extrabold text-[10px] text-island-purple uppercase tracking-widest">Back to Islands</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-xl font-black text-island-purple tracking-widest uppercase">Wonder Island</h1>
<div class="flex gap-1.5 mt-1">
<div class="size-2 rounded-full bg-island-pink"></div>
<div class="size-2 rounded-full bg-island-pink"></div>
<div class="size-2 rounded-full bg-slate-300"></div>
</div>
</div>
<div class="flex items-center gap-3">
<div class="px-5 py-2.5 rounded-2xl bg-[#4b2038] text-white font-black flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-yellow-400" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-sm">Level 5</span>
</div>
</div>
</header>
<!-- Main Workspace -->
<main class="flex-1 flex flex-col items-center justify-center px-10 relative">
<!-- Decorative Cloud Elements -->
<div class="absolute top-10 left-16 opacity-30 pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-white">cloud</span>
</div>
<!-- Letter Blocks Area -->
<div class="flex gap-6 mb-24 items-center">
<!-- Letter C -->
<div class="relative group">
<div class="w-44 h-44 bg-white rounded-3xl tactile-block flex items-center justify-center p-3">
<div class="w-full h-full bg-[#ffb7dd] rounded-2xl letter-inner flex items-center justify-center">
<span class="text-white text-9xl font-black drop-shadow-md">C</span>
</div>
</div>
</div>
<!-- Letter A -->
<div class="relative group">
<div class="w-44 h-44 bg-white rounded-3xl tactile-block flex items-center justify-center p-3">
<div class="w-full h-full bg-[#f97316] rounded-2xl letter-inner flex items-center justify-center">
<span class="text-white text-9xl font-black drop-shadow-md">A</span>
</div>
</div>
</div>
<!-- Letter T -->
<div class="relative group">
<div class="w-44 h-44 bg-white rounded-3xl tactile-block flex items-center justify-center p-3">
<div class="w-full h-full bg-[#4b2038] rounded-2xl letter-inner flex items-center justify-center">
<span class="text-white text-9xl font-black drop-shadow-md">T</span>
</div>
</div>
</div>
</div>
<!-- The Blender Slider -->
<div class="w-full max-w-4xl bg-white/40 p-10 rounded-[4rem] border-2 border-white/60 backdrop-blur-md shadow-2xl">
<div class="flex justify-between items-center mb-6 px-6">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-island-purple/40 text-2xl" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
<h3 class="text-sm font-black text-island-purple/50 tracking-widest uppercase">Slide to Blend Letters</h3>
</div>
<div class="flex items-center gap-2 bg-[#4ade80]/20 px-4 py-1.5 rounded-full border border-[#4ade80]/30">
<span class="size-2 rounded-full bg-[#4ade80] animate-pulse"></span>
<span class="text-[10px] font-black text-[#166534] uppercase tracking-tighter">Ready to Play</span>
</div>
</div>
<!-- Slider Track -->
<div class="relative h-20 w-full bg-slate-200/80 rounded-full slider-track-inner border-2 border-slate-300 flex items-center px-4">
<!-- Progress fill -->
<div class="absolute left-4 top-4 bottom-4 w-[60%] bg-[#4ade80] rounded-full opacity-40"></div>
<!-- Labels -->
<div class="absolute left-12 text-slate-400 font-black text-lg tracking-widest">START</div>
<div class="absolute right-12 text-slate-400 font-black text-lg tracking-widest">FINISH</div>
<!-- Handle: Tactile Knob/Star -->
<div class="absolute left-[60%] -translate-x-1/2 z-20">
<div class="size-24 bg-[#4ade80] rounded-full shadow-[0_8px_0_#16a34a,0_15px_30px_rgba(0,0,0,0.2)] border-4 border-white flex items-center justify-center cursor-grab active:cursor-grabbing transform hover:scale-105 transition-transform">
<div class="size-16 rounded-full bg-white/30 flex items-center justify-center border-2 border-white/50">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
</div>
<!-- Pull Me Tag -->
<div class="absolute -top-14 left-1/2 -translate-x-1/2 bg-[#4ade80] text-white px-4 py-1.5 rounded-xl text-[10px] font-black whitespace-nowrap shadow-lg animate-bounce">
                            PULL ME!
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 size-2 bg-[#4ade80] rotate-45"></div>
</div>
</div>
</div>
</div>
<!-- Floating Bubbles Decorations -->
<div class="absolute bottom-20 right-20 opacity-20 pointer-events-none">
<div class="flex gap-2">
<div class="size-6 rounded-full bg-island-accent"></div>
<div class="size-10 rounded-full bg-island-accent/60"></div>
<div class="size-4 rounded-full bg-island-accent/40"></div>
</div>
</div>
</main>
<!-- Footer UI -->
<footer class="px-10 py-10 flex justify-between items-center bg-white/20 backdrop-blur-sm">
<div class="flex gap-5 items-center">
<div class="size-20 rounded-3xl bg-white tactile-block p-1.5 flex items-center justify-center">
<img class="w-full h-full object-cover rounded-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyuoYecED--etDdOJynAghdY33ckt7rolDxWbLhqv9jceSMrnKsKzekxmSSjVrPL1WIpAF03QX2XZtI7KVRNoYCHHn-WiSw8CKp9pGWao4_rL4WvQYdThMnFcaOT_KMP6s5GeJjo-A68Jecz1cxn9QYIqr2opgEX28x9qWROG_9PrHr7NdAqknX7ChdBCQWj6LOuzoWXlkoINWqAqNjpuSTdsg9pxe--BgkTYhEFOt0XQrKHGxiuAih9ne2bFQVlqhbNUbSJ-Ftcfa"/>
</div>
<div class="flex flex-col">
<span class="text-[10px] font-black text-island-purple/40 uppercase tracking-[0.2em]">Current Word</span>
<span class="text-4xl font-black text-island-purple tracking-widest">C - A - T</span>
</div>
</div>
<div class="flex gap-4">
<button class="size-16 rounded-3xl bg-white border-b-4 border-slate-200 flex items-center justify-center text-island-purple hover:bg-slate-50 transition-all active:translate-y-1 active:border-b-0">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<button class="size-16 rounded-3xl bg-white border-b-4 border-slate-200 flex items-center justify-center text-island-purple hover:bg-slate-50 transition-all active:translate-y-1 active:border-b-0">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0;">refresh</span>
</button>
<button class="h-16 px-12 rounded-3xl bg-island-purple text-white font-black text-lg flex items-center gap-3 shadow-xl hover:brightness-110 active:scale-95 transition-all">
<span class="tracking-widest">NEXT WORD</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
</footer>
</div>
</body></html>
