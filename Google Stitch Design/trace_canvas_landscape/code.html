<html><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec5b13",
            "secondary": "#f8c444",
            "background-light": "#fdfaf7",
            "background-dark": "#221610",
            "island-green": "#4cc082",
            "island-blue": "#4aa9ff",
          },
          fontFamily: {
            "display": ["Public Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "2.5rem",
            "full": "9999px"
          },
          boxShadow: {
            "tactile": "0 8px 0 rgba(0,0,0,0.1), 0 15px 30px -5px rgba(0,0,0,0.1)",
            "tactile-primary": "0 8px 0 #c44a0f",
            "tactile-inner": "inset 0 4px 8px rgba(0,0,0,0.1)",
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .letter-track {
      -webkit-text-stroke: 60px #f1ede9;
      color: transparent;
      paint-order: stroke fill;
    }
    .letter-outline-inner {
      -webkit-text-stroke: 2px #e5e0db;
      color: transparent;
      position: absolute;
      top: 0;
      left: 0;
    }
    .canvas-dots {
      background-size: 60px 60px;
      background-image: radial-gradient(circle, #e8e2dc 2px, transparent 2px);
    }
    .squishy-bar {
      box-shadow: 0 12px 0 #e5e0db, 0 20px 40px -10px rgba(0,0,0,0.15);
      border-bottom: 4px solid rgba(0,0,0,0.05);
    }
    .active-trace {
      filter: drop-shadow(0 0 15px rgba(236, 91, 19, 0.4));
      stroke-dasharray: 1000;
      stroke-dashoffset: 0;
    }
    @keyframes pulse-dot {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .start-dot-pulse {
      animation: pulse-dot 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-background-light font-display text-background-dark overflow-hidden select-none">
<div class="relative flex h-screen w-full flex-col overflow-hidden canvas-dots">
<!-- High-Fidelity Header -->
<header class="flex items-center justify-between px-10 py-6 z-20">
<div class="flex items-center gap-6">
<button class="flex items-center justify-center size-16 rounded-2xl bg-white shadow-tactile border-2 border-gray-100 text-background-dark active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<div class="flex flex-col">
<h2 class="text-3xl font-900 tracking-tight text-background-dark">Trace the Letter</h2>
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-island-green"></span>
<p class="text-lg font-bold text-gray-500 uppercase tracking-widest">Mastering Letter M</p>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-3 bg-white px-8 py-3 rounded-2xl shadow-tactile border-2 border-gray-100">
<span class="material-symbols-outlined text-secondary text-3xl">stars</span>
<span class="font-900 text-2xl">1,240</span>
</div>
<button class="size-16 rounded-2xl bg-white shadow-tactile border-2 border-gray-100 flex items-center justify-center active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-3xl text-gray-400">settings</span>
</button>
</div>
</header>
<!-- Main Trace Canvas Area - Optimized for iPad Landscape -->
<main class="relative flex-1 flex flex-col items-center justify-center">
<!-- Letter Container -->
<div class="relative flex items-center justify-center w-full h-[70vh] max-w-5xl">
<!-- Thick Tracing Track -->
<div class="relative">
<!-- The Gray Track (Thick Background) -->
<span class="letter-track text-[65vh] font-black leading-none block">M</span>
<!-- The Subtle Center Line for guidance -->
<span class="letter-outline-inner text-[65vh] font-black leading-none block">M</span>
<!-- SVG Trace Layer -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="xMidYMid meet" viewbox="0 0 500 500">
<!-- Traced Progress -->
<path class="active-trace" d="M 115,400 L 115,100 L 250,250" fill="none" stroke="#ec5b13" stroke-linecap="round" stroke-linejoin="round" stroke-width="45"></path>
<!-- Clear Start Dot -->
<circle class="start-dot-pulse" cx="115" cy="400" fill="#ec5b13" r="28" stroke="white" stroke-width="6"></circle>
<text dy=".3em" fill="white" font-size="24" font-weight="900" text-anchor="middle" x="115" y="400">1</text>
<!-- Current Drawing Tip -->
<circle class="active-trace" cx="250" cy="250" fill="#ec5b13" r="22" stroke="white" stroke-width="4"></circle>
</svg>
</div>
<!-- Floating Instructional Arrow -->
<div class="absolute left-[15%] top-[55%] pointer-events-none">
<div class="flex flex-col items-center gap-2 animate-bounce">
<div class="bg-primary text-white p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-4xl">arrow_upward</span>
</div>
<p class="text-primary font-900 text-lg">START HERE</p>
</div>
</div>
</div>
<!-- Character Companion - Tactile 3D Clay -->
<div class="absolute bottom-20 left-16 w-64 h-64 z-10">
<img alt="Monkey" class="w-full h-full object-contain drop-shadow-2xl" data-alt="A friendly, wide-eyed cartoon monkey character with soft brown fur and a playful expression, designed in a vibrant 3D claymation style. The monkey is sitting cheerfully, looking towards the viewer with a big encouraging smile. High resolution, high-key lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQMnxfqszCa53e81TRTeeOhBKBzL2MtD00sp1qbMgtuvmihtQkRhlFgQkces7iRvQ1yXYcEUB4oFOa8iuuXvHk3dGziy32K-LpHji52W1olB10Y5A6PbQ-uZSTFFPceI7-ZIBidwIC93O9arZ-EEeEyvGGJt_l_e1gpCwc38xcdwAbs7Fzp8_r4kmMyU4TDfEQxCTFRnpDdIB5aQA3cvqHc-P5ZDf4s5U_3jQg0olcGE5S8o2UdjKrR0J0KYnqGqcUnNzT-8ChJaTn"/>
<div class="absolute -top-4 -right-4 bg-white px-4 py-2 rounded-2xl shadow-tactile border-2 border-gray-100 font-bold text-background-dark whitespace-nowrap">
          You're doing great! 🍌
        </div>
</div>
<!-- Floating Tool Palette -->
<div class="absolute right-12 top-1/2 -translate-y-1/2 flex flex-col gap-6">
<button class="size-20 rounded-3xl bg-primary shadow-tactile-primary flex items-center justify-center text-white border-b-4 border-black/10 active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-4xl">edit</span>
</button>
<button class="size-20 rounded-3xl bg-white shadow-tactile flex items-center justify-center text-gray-400 border-2 border-gray-50 active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-4xl">auto_fix</span>
</button>
<button class="size-20 rounded-3xl bg-white shadow-tactile flex items-center justify-center text-island-blue border-2 border-gray-50 active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-4xl">palette</span>
</button>
<div class="h-2 w-12 bg-gray-200/50 rounded-full mx-auto my-2"></div>
<button class="size-20 rounded-3xl bg-white shadow-tactile flex items-center justify-center text-gray-400 border-2 border-gray-50 active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-4xl">delete</span>
</button>
</div>
</main>
<!-- Bottom Swipe-to-Read Bar - Prominent & Squishy -->
<footer class="p-10 flex justify-center items-center z-30">
<div class="relative w-full max-w-3xl">
<!-- The Squishy Container -->
<div class="squishy-bar bg-white rounded-full h-32 flex items-center px-6 border-4 border-gray-50">
<!-- Background Faded Word -->
<div class="absolute inset-0 flex items-center justify-center overflow-hidden">
<span class="text-6xl font-900 tracking-[0.6em] text-gray-100 uppercase select-none">
              MONKEY
            </span>
</div>
<!-- The Slider Track UI -->
<div class="relative flex items-center w-full">
<!-- Progress Fill Area -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 h-20 bg-primary/10 rounded-full border-4 border-dashed border-primary/30" style="width: 100%;"></div>
<!-- Animated Leading Edge -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 h-20 bg-primary rounded-full flex items-center pl-24 pr-8 shadow-tactile-primary transition-all duration-300" style="width: 35%;">
<span class="text-5xl font-900 text-white tracking-[0.6em] uppercase">M</span>
</div>
<!-- The Big Tactile Handle -->
<div class="relative h-24 w-24 rounded-full bg-secondary shadow-tactile border-4 border-white flex items-center justify-center text-background-dark cursor-grab active:cursor-grabbing hover:scale-105 transition-all z-10" style="margin-left: 28%;">
<span class="material-symbols-outlined text-5xl">chevron_right</span>
</div>
</div>
<!-- Prompt Bubble -->
<div class="absolute -top-14 left-1/2 -translate-x-1/2">
<div class="bg-primary text-white px-8 py-2 rounded-full font-900 text-lg shadow-tactile-primary uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined">swipe</span>
            Swipe to read
          </div>
</div>
</div>
</div>
</footer>
<!-- Success Feedback Overlay (Hidden) -->
<div class="hidden fixed inset-0 bg-background-dark/40 backdrop-blur-md z-50 flex items-center justify-center p-6">
<div class="bg-white p-16 rounded-[4rem] shadow-tactile border-8 border-island-green/20 text-center max-w-lg">
<div class="size-48 bg-island-green rounded-full mx-auto mb-10 flex items-center justify-center text-white shadow-tactile-primary">
<span class="material-symbols-outlined text-9xl">check_circle</span>
</div>
<h3 class="text-6xl font-900 mb-4 text-background-dark">AMAZING!</h3>
<p class="text-2xl text-gray-600 font-bold mb-12">You finished the letter M!</p>
<button class="w-full bg-primary text-white py-8 rounded-[2.5rem] font-900 text-3xl shadow-tactile-primary hover:scale-105 active:scale-95 transition-all">
          NEXT LETTER
        </button>
</div>
</div>
</div>
</body></html>
